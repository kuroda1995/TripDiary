# 本番用（docs/architecture.md 5章 / docs/rules.md 5章）
# - ログは JSON（Logstash 形式）で標準出力へ。MDC（requestId / userId）は自動で出力される
# - Swagger UI / API 仕様 JSON は公開しない
logging:
  structured:
    format:
      console: logstash
    json:
      add:
        app: tripdiary-api
        env: production
  level:
    root: INFO
    com.tripdiary: INFO

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
