spring:
  application:
    name: tripdiary-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tripdiary}
    username: ${DB_USERNAME:tripdiary}
    password: ${DB_PASSWORD:tripdiary}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        # 一覧で関連（エリアタグ等）を IN 句でまとめて取得し、N+1 を避ける
        default_batch_fetch_size: 100
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: UTC

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    operations-sorter: alpha
    tags-sorter: alpha

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    # 開発・テスト専用の既定値。本番（prod）では環境変数 JWT_SECRET（Base64・32バイト以上）が必須
    secret: ${JWT_SECRET:dHJpcGRpYXJ5LWxvY2FsLWRldmVsb3BtZW50LW9ubHktand0LXNlY3JldC1rZXk=}
    issuer: tripdiary-api
    access-token-ttl: 15m
    refresh-token-ttl: 14d
    refresh-cookie-secure: ${JWT_REFRESH_COOKIE_SECURE:true}
  auth:
    login-rate-limit:
      max-attempts: 10
      window: 5m

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
