spring:
  application:
    name: tripdiary-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tripdiary}
    username: ${DB_USERNAME:tripdiary}
    password: ${DB_PASSWORD:tripdiary}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: UTC

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    operations-sorter: alpha
    tags-sorter: alpha

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
